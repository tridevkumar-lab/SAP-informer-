<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP Yard Assistant</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f3f6f8;color:#17212b;margin:0}
    main{max-width:850px;margin:40px auto;padding:24px;background:white;border-radius:14px;box-shadow:0 8px 28px #18304712}
    h1{margin:0 0 6px;color:#123b5d} .sub{color:#5d6c79;margin:0 0 22px}
    textarea,input{font:inherit;padding:12px;border:1px solid #c7d1d9;border-radius:8px;width:100%;box-sizing:border-box;margin:6px 0 12px}
    .row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}button{background:#087e8b;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}
    #answer{white-space:pre-wrap;background:#f6f8fa;padding:18px;border-radius:8px;margin-top:18px;min-height:50px}
    #sources{font-size:14px;color:#52616e} .hint{font-size:13px;color:#687784}@media(max-width:650px){main{margin:10px;padding:18px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>SAP & Yard Assistant</h1>
  <p class="sub">Ask about a process or SAP error. For live stock, enter material and plant.</p>
  <label for="message">Question or exact error message</label>
  <textarea id="message" rows="4" placeholder="Example: What should I check when goods receipt shows a stock error?"></textarea>
  <div class="row">
    <label>Material (for stock lookup)<input id="material" placeholder="Material number"></label>
    <label>Plant<input id="plant" placeholder="Plant"></label>
    <label>Storage location<input id="sloc" placeholder="Optional"></label>
  </div>
  <button onclick="sendQuestion()">Ask</button>
  <button onclick="indexDocs()" style="background:#516779">Index local procedures</button>
  <div id="answer" aria-live="polite">Your answer will appear here.</div><div id="sources"></div>
  <p class="hint">Answers use your local knowledge base. Live SAP data appears only when an approved read-only connector is configured.</p>
</main>
<script>
async function sendQuestion(){
 const box=document.getElementById('answer'), src=document.getElementById('sources');
 box.textContent='Working…';src.textContent='';
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.getElementById('message').value,material:document.getElementById('material').value||null,plant:document.getElementById('plant').value||null,storage_location:document.getElementById('sloc').value||null})});
 const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');box.textContent=`[${d.intent}] ${d.answer}`+(d.data_as_of?`\n\nData read at: ${d.data_as_of}`:'');src.textContent=d.sources?.length?'Sources: '+d.sources.map(s=>s.name).join(', '):'';
 }catch(e){box.textContent='Error: '+e.message}}
async function indexDocs(){const box=document.getElementById('answer');box.textContent='Indexing local documents…';try{const r=await fetch('/api/admin/ingest',{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Indexing failed');box.textContent=`Indexed ${d.documents} document(s). Chunk counts: ${JSON.stringify(d.indexed_documents)}`}catch(e){box.textContent='Error: '+e.message}}
</script></body></html>
